# Sanitized from the tested deployment; replace host-specific placeholders before use.
version: "3.8"

services:
  vllm-ds4-node1:
    image: aidendle94/sparkrun-vllm-ds4-gb10:production-3.73-vision
    container_name: vllm-ds4-worker

    network_mode: host
    ipc: host
    privileged: true
    shm_size: "32gb"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      - /path/to/DeepSeek-V4-Flash-Vision-Exp:/model:ro
      - ./speculative_k5.py:/usr/local/lib/python3.12/dist-packages/vllm/config/speculative.py:ro

    environment:
      # ---------- model ----------
      - MODEL_PATH=/model
      - SERVED_MODEL_NAME=DeepSeek-V4-Flash

      # ---------- distributed ----------
      - NODE_RANK=1
      - NNODES=2
      - TP_SIZE=2
      - MASTER_ADDR=10.0.0.10
      - MASTER_PORT=29500
      - VLLM_HOST_IP=10.0.0.20

      # rank 1 自动进入 headless，不需要 command 里再写 --headless

      # ---------- network ----------
      - GLOO_SOCKET_IFNAME=YOUR_DATA_IFACE
      - NCCL_SOCKET_IFNAME=YOUR_DATA_IFACE
      - TP_SOCKET_IFNAME=YOUR_DATA_IFACE

      - NCCL_IB_HCA=YOUR_ROCE_HCA
      - NCCL_IB_GID_INDEX=3
      - UCX_NET_DEVICES=YOUR_ROCE_HCA:1

      - NCCL_IB_DISABLE=0
      - NCCL_NET_GDR_LEVEL=0
      - NCCL_CROSS_NIC=1
      - NCCL_CUMEM_ENABLE=0
      - NCCL_ASYNC_ERROR_HANDLING=1
      - NCCL_IGNORE_CPU_AFFINITY=1

      # ---------- UCX ----------
      - UCX_RCACHE_MAX_UNRELEASED=1024
      - UCX_MEM_MMAP_HOOK_MODE=none

      # ---------- model/runtime profile ----------
      - MAX_MODEL_LEN=393216
      - MAX_NUM_SEQS=6
      - MAX_NUM_BATCHED_TOKENS=8192
      - GPU_MEMORY_UTILIZATION=0.85

      # ---------- DSpark ----------
      - VLLM_ENABLE_DSPARK=1
      - VLLM_ENABLE_MTP=0
      - NUM_SPECULATIVE_TOKENS=5
      - DSPARK_DRAFT_SAMPLE_METHOD=probabilistic
      - DSPARK_DRAFT_ATTENTION_BACKEND=B12X_MLA_SPARSE

      # ---------- cache ----------
      - ENABLE_PREFIX_CACHING=1
      - ENABLE_FLASHINFER_AUTOTUNE=0

      # ---------- runtime ----------
      - CUDA_MODULE_LOADING=LAZY
      - VLLM_ENABLE_V1_MULTIPROCESSING=0
      - VLLM_PREFIX_CACHE_RETENTION_INTERVAL=4096
      - VLLM_RPC_TIMEOUT_S=300000
      - VLLM_ENGINE_ITERATION_TIMEOUT_S=300
      - VLLM_LOGGING_LEVEL=INFO
      - VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK=1
      - TORCH_DISTRIBUTED_TIMEOUT=1800

    restart: "no"
